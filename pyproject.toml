[project]
name = "curanews"
version = "0.1.0"
description = "Social-media and web-backed dynamic news aggregator (CuraNews)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Proprietary" }
authors = [
    { name = "Faruk-T" }
]
keywords = ["news", "aggregator", "scrapy", "fastapi", "nlp"]

[project.scripts]
curanews = "curanews.__main__:main"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "curanews", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
# Config / API
pydantic = "^2.10.0"
pydantic-settings = "^2.7.0"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.34.0" }
httpx = "^0.28.0"
# Scraping (static + dynamic)
scrapy = "^2.12.0"
beautifulsoup4 = "^4.12.0"
lxml = "^5.3.0"
playwright = "^1.49.0"
# Persistence / cache (wired in later issues)
sqlalchemy = "^2.0.36"
alembic = "^1.14.0"
psycopg = { extras = ["binary"], version = "^3.2.0" }
redis = "^5.2.0"
# NLP (model download is separate)
spacy = "^3.8.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.25.0"
ruff = "^0.9.0"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: fast isolated unit tests",
    "integration: cross-module tests (API TestClient, ingestion, curation)",
    "redis: optional live Redis tests (set CURANEWS_REDIS_URL)",
    "network: optional public-internet tests (set CURANEWS_LIVE_RSS=1)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

