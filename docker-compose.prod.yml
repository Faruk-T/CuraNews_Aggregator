# CuraNews Aggregator — Production Docker Compose (Day 23)
# Fully automated multi-container stack with Caddy Reverse Proxy & Auto-SSL

services:
  postgres:
    image: postgres:16-alpine
    container_name: curanews-prod-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-curanews}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-curanews_prod_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-curanews}
    volumes:
      - curanews_prod_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-curanews} -d ${POSTGRES_DB:-curanews}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - curanews_prod_network

  redis:
    image: redis:7-alpine
    container_name: curanews-prod-redis
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - curanews_prod_network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: curanews-prod-api
    restart: always
    environment:
      APP_ENV: prod
      LOG_LEVEL: INFO
      APP_NAME: "CuraNews Aggregator"
      DOMAIN_NAME: ${DOMAIN_NAME:-localhost}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-curanews}:${POSTGRES_PASSWORD:-curanews_prod_secret_2026}@postgres:5432/${POSTGRES_DB:-curanews}
      REDIS_URL: redis://redis:6379/0
      API_HOST: 0.0.0.0
      API_PORT: 8000
      FEED_CACHE_TTL_SECONDS: 180
      READ_INBOX_GRACE_SECONDS: 1200
      CURANEWS_BOOTSTRAP: "1"
      PII_HASH_SALT: ${PII_HASH_SALT:-curanews-prod-pii-salt-2026}
      ADSENSE_PUB_ID: ${ADSENSE_PUB_ID:-pub-8573920194827104}
      GA_MEASUREMENT_ID: ${GA_MEASUREMENT_ID:-G-CURANEWS2026}
      SCRAPE_ALLOWLIST_HOSTS: "example.com,gnews.io,localhost,127.0.0.1,feeds.bbci.co.uk,www.theguardian.com,feeds.npr.org,www.aljazeera.com,rss.dw.com,www.aa.com.tr,www.trthaber.com,www.ahaber.com.tr,www.ntv.com.tr,www.cnnturk.com,www.hurriyet.com.tr,www.milliyet.com.tr,www.haberturk.com"
      SCRAPE_USER_AGENT: "CuraNewsBot/1.0 (+https://${DOMAIN_NAME:-curanews.com})"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 45s
    networks:
      - curanews_prod_network

  caddy:
    image: caddy:2-alpine
    container_name: curanews-prod-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - curanews_prod_caddy_data:/data
      - curanews_prod_caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks:
      - curanews_prod_network

networks:
  curanews_prod_network:
    driver: bridge

volumes:
  curanews_prod_pg_data:
  curanews_prod_caddy_data:
  curanews_prod_caddy_config:
